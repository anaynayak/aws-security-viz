# Tooling for the documentation site only; the gem itself is built from the gemspec.
[project]
name = "aws-security-viz-docs"
version = "0.0.0"
description = "Documentation site tooling for aws-security-viz"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
docs = [
    "mkdocs-material>=9.6",
    "mkdocs<2",
]
# Headless-browser specs and script/docs-screenshots. Chromium itself is installed with
# `uv run --group browser playwright install chromium`; the pin keeps the driver and the browser build in step.
browser = [
    "playwright==1.55.0",
    "pillow==12.3.0",
]

[tool.uv]
package = false
default-groups = []
