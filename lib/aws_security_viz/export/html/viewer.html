<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<title>AWS security groups</title>
<style>
  html, body { margin: 0; height: 100%; font: 13px/1.4 system-ui, sans-serif; color: #222; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #ccc; background: #f6f6f6; }
  #bar input[type=search] { width: 220px; padding: 3px 6px; }
  #main { display: flex; flex: 1; min-height: 0; }
  #cy { flex: 1; }
  #details { width: 320px; overflow: auto; padding: 10px 12px; border-left: 1px solid #ccc; background: #fafafa; }
  #details h2 { margin: 0 0 6px; font-size: 15px; }
  #details h3 { margin: 12px 0 4px; font-size: 13px; }
  #details ul { margin: 0; padding-left: 18px; }
  .risky { color: #b00020; font-weight: bold; }
  .muted { color: #666; }
  #pathbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #pathbar input { width: 150px; padding: 3px 6px; }
  #pathbar #path-port { width: 110px; }
  #legend span { margin-right: 10px; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <input id="search" type="search" placeholder="Search groups" aria-label="Search groups">
    <label><input id="ingress" type="checkbox" checked> Ingress</label>
    <label><input id="egress" type="checkbox" checked> Egress</label>
    <label><input id="risky-only" type="checkbox"> Risky only</label>
    <label><input id="webgl" type="checkbox"> WebGL</label>
    <label>Layout <select id="layout" aria-label="Layout">
      <option value="fcose">Force (fcose)</option>
      <option value="flow">Traffic flow</option>
      <option value="rings">Exposure rings</option>
      <option value="grid">Grid within VPC</option>
    </select></label>
    <button id="reset" type="button">Reset view</button>
    <span id="pathbar">
      <input id="path-from" list="path-names" placeholder="Can this reach..." aria-label="Path source" autocomplete="off">
      <input id="path-to" list="path-names" placeholder="...this group?" aria-label="Path target" autocomplete="off">
      <input id="path-port" placeholder="Port (optional)" aria-label="Port filter" autocomplete="off">
      <button id="path-find" type="button">Find path</button>
      <button id="path-clear" type="button">Clear path</button>
      <datalist id="path-names"></datalist>
    </span>
    <button id="expand-all" type="button">Expand all</button>
    <button id="collapse-all" type="button">Collapse all</button>
    <span id="legend" class="muted"><span style="color:#1f5fbf">blue: ingress</span><span style="color:#c0392b">red: egress</span><span style="color:#d6006f;font-weight:bold">thickest magenta: risky public ingress</span><span>grey dashed node: unused</span><span>double-click a VPC to collapse or expand it</span></span>
  </div>
  <div id="main">
    <div id="cy"></div>
    <div id="details"><p class="muted">Click a group or an edge to see its details.</p></div>
  </div>
</div>
<script type="application/json" id="graph-data">/*DATA*/</script>
<script>/*CYTOSCAPE*/</script>
<script>/*LAYOUT_BASE*/</script>
<script>/*COSE_BASE*/</script>
<script>/*FCOSE*/</script>
<script>/*DAGRE*/</script>
<script>/*CYTOSCAPE_DAGRE*/</script>
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("graph-data").textContent);
  var nodeById = {};
  data.nodes.forEach(function (n) { nodeById[n.id] = n; });

  // Graphs with more than this many security groups inside VPCs (peers such as CIDRs are not counted) open with every VPC collapsed into one node.
  var COLLAPSE_THRESHOLD = 150;

  // Compound parents: region (when several regions were queried) containing VPC.
  var parentDefs = {};   // region and VPC node definitions; always on the canvas
  var groupDefs = {};    // security group and peer node definitions
  var vpcOf = {};        // group id -> id of the VPC node it sits in
  var vpcGroups = {};    // VPC node id -> ids of its groups
  function parent(id, label, kind, parentId) {
    if (!parentDefs[id]) {
      var d = { id: id, label: label, name: label, kind: kind };
      if (parentId) d.parent = parentId;
      parentDefs[id] = { group: "nodes", data: d, classes: kind };
    }
    return id;
  }
  data.nodes.forEach(function (n) {
    var d = { id: n.id, label: n.label, kind: "group", unused: !!n.unused };
    var up = null;
    if (n.region) up = parent("region:" + n.region, n.region, "region", null);
    if (n.vpc) {
      up = parent("vpc:" + (n.region || "") + "|" + n.vpc, n.vpc, "vpc", up);
      vpcOf[n.id] = up;
      (vpcGroups[up] = vpcGroups[up] || []).push(n.id);
    }
    if (up) d.parent = up;
    groupDefs[n.id] = { group: "nodes", data: d, classes: n.unused ? "unused" : "" };
  });
  var realEdges = data.edges.map(function (e) {
    return { group: "edges", data: { id: e.id, source: e.source, target: e.target, label: e.label || "", kind: e.kind, risky: !!e.risky }, classes: e.kind + (e.risky ? " risky" : "") };
  });

  // Node sizes are measured here, not left to Cytoscape's "label" sizing: that is only known once the renderer has
  // drawn a label, and a layout that runs earlier would see zero-size nodes and leave elements invisible.
  var measure = document.createElement("canvas").getContext("2d");
  var FONT = "system-ui, sans-serif";
  // Region and VPC labels are bold 12px, group and peer labels 11px; see STYLE.
  function nodeSize(label, kind) {
    var parentKind = kind === "vpc" || kind === "region";
    measure.font = (parentKind ? "bold 12px " : "11px ") + FONT;
    return { w: Math.ceil(measure.measureText(String(label)).width) + 2, h: parentKind ? 15 : 14 };
  }

  var collapsed = {};
  var groupCount = Object.keys(vpcGroups).reduce(function (sum, id) { return sum + vpcGroups[id].length; }, 0);
  if (groupCount > COLLAPSE_THRESHOLD) Object.keys(vpcGroups).forEach(function (id) { collapsed[id] = true; });

  function collapsedLabel(id) { return parentDefs[id].data.name + " (" + vpcGroups[id].length + " groups)"; }

  // Everything that should be on the canvas for the current collapsed set. Edges that touch a collapsed
  // VPC are merged into one meta edge per (source, target, direction).
  function desired() {
    var out = { nodes: [], edges: [] };
    var internal = {};
    // Cytoscape keeps the data object it is given, so every element gets its own copy.
    function copy(def, extra, classes) {
      var d = Object.assign({}, def.data, extra);
      if (def.group === "nodes") Object.assign(d, nodeSize(d.label, d.kind));
      return { group: def.group, data: d, classes: classes === undefined ? def.classes : classes };
    }
    Object.keys(parentDefs).forEach(function (id) {
      var def = parentDefs[id];
      out.nodes.push(collapsed[id] ? copy(def, { label: collapsedLabel(id), internal: 0, internalRisky: 0 }, def.classes + " collapsed") : copy(def, { label: def.data.name, internal: 0, internalRisky: 0 }));
    });
    Object.keys(groupDefs).forEach(function (id) {
      if (!collapsed[vpcOf[id]]) out.nodes.push(copy(groupDefs[id], {}));
    });
    var meta = {};
    realEdges.forEach(function (def) {
      var d = def.data;
      var s = collapsed[vpcOf[d.source]] ? vpcOf[d.source] : d.source;
      var t = collapsed[vpcOf[d.target]] ? vpcOf[d.target] : d.target;
      if (s === d.source && t === d.target) { out.edges.push(copy(def, {})); return; }
      if (s === t) {
        // Rule between two groups of the same collapsed VPC (or a self-reference): counted on the VPC node.
        internal[s] = internal[s] || { count: 0, risky: 0 };
        internal[s].count++;
        if (d.risky) internal[s].risky++;
        return;
      }
      var key = "meta:" + s + ">" + t + "|" + d.kind;
      var m = meta[key] = meta[key] || { group: "edges", data: { id: key, source: s, target: t, kind: d.kind, risky: false, meta: true, members: [], riskyMembers: [] }, classes: "meta " + d.kind };
      m.data.members.push(d.id);
      if (d.risky) { m.data.risky = true; m.data.riskyMembers.push(d.id); }
    });
    Object.keys(meta).forEach(function (key) {
      var m = meta[key];
      m.data.label = m.data.members.length + (m.data.members.length === 1 ? " rule" : " rules");
      if (m.data.risky) m.classes += " risky";
      out.edges.push(m);
    });
    out.nodes.forEach(function (n) {
      if (internal[n.data.id]) { n.data.internal = internal[n.data.id].count; n.data.internalRisky = internal[n.data.id].risky; }
    });
    return out;
  }
  var initial = desired();
  var elements = initial.nodes.concat(initial.edges);

  cytoscape.use(cytoscapeFcose);
  cytoscape.use(cytoscapeDagre);
  var LAYOUT = { name: "fcose", animate: false, quality: "proof", randomize: false, nodeDimensionsIncludeLabels: true, packComponents: true, nodeSeparation: 150, nestingFactor: 0.1, nodeRepulsion: 20000, idealEdgeLength: 120, edgeElasticity: 1.5, padding: 30 };

  var STYLE = [
      { selector: "node", style: { label: "data(label)", "min-zoomed-font-size": 6, "font-family": FONT, "font-size": 11, "text-valign": "center", "text-halign": "center", "background-color": "#e8f0fe", "border-width": 1, "border-color": "#5b7bd5", shape: "round-rectangle", width: "data(w)", height: "data(h)", padding: "8px" } },
      { selector: "node.region, node.vpc", style: { "text-valign": "top", "background-opacity": 0.06, "background-color": "#555", "border-color": "#999", "border-style": "dashed", padding: "14px", "font-weight": "bold", "font-size": 12 } },
      { selector: "node.vpc.collapsed", style: { "text-valign": "center", "background-opacity": 0.2, "border-style": "solid", "border-width": 2, padding: "12px", shape: "round-rectangle" } },
      { selector: "node.unused", style: { "background-color": "#eee", "border-style": "dashed", "border-color": "#888", color: "#555" } },
      { selector: "edge", style: { label: "", "min-zoomed-font-size": 6, "font-size": 9, width: 1.5, "curve-style": "bezier", "target-arrow-shape": "triangle", "text-background-color": "#fff", "text-background-opacity": 0.85, "text-background-padding": "1px" } },
      { selector: "edge.ingress", style: { "line-color": "#1f5fbf", "target-arrow-color": "#1f5fbf" } },
      { selector: "edge.egress", style: { "line-color": "#c0392b", "target-arrow-color": "#c0392b" } },
      { selector: "edge.meta", style: { width: 3 } },
      { selector: "edge.risky", style: { width: 5, "arrow-scale": 1.6, "line-style": "dashed", "line-color": "#d6006f", "target-arrow-color": "#d6006f", color: "#b00060" } },
            { selector: "edge.hover, edge.show-label, edge:selected, edge.path", style: { label: "data(label)", "min-zoomed-font-size": 0 } },
      { selector: "node.show-label, node:selected", style: { "min-zoomed-font-size": 0 } },
      { selector: "node.path, node.pathvia", style: { "border-width": 3, "border-color": "#ff8c00" } },
      { selector: "edge.path", style: { width: 6, "arrow-scale": 1.5, "line-color": "#ff8c00", "target-arrow-color": "#ff8c00", "z-index": 10 } },
      { selector: ".dim", style: { opacity: 0.12, "text-opacity": 0.12, "text-background-opacity": 0.12 } },
      { selector: ".match", style: { "border-width": 3, "border-color": "#f39c12" } },
      { selector: ":selected", style: { "overlay-color": "#f39c12", "overlay-opacity": 0.25 } },
      // Last, so nothing above (selection, match, dim) can draw a box the layout has no use for: the VPC and region
      // boxes of a layout that cannot respect them (exposure rings) are not there at all.
      { selector: "node.flat:parent", style: { label: "", "background-opacity": 0, "border-width": 0, "overlay-opacity": 0, "text-opacity": 0, events: "no" } }
  ];

  // Cytoscape's experimental WebGL renderer is much faster on thousands of elements. It is chosen when more
  // than this many elements are on the canvas, can be switched with the WebGL checkbox, and is skipped when
  // the browser has no WebGL 2 (headless CI, locked-down browsers): the canvas renderer is used then.
  var WEBGL_THRESHOLD = 2000;
  var GAP = 12;          // minimum space between sibling boxes after a layout
  // Give a canvas's WebGL context back to the browser, which allows only about sixteen live ones.
  function releaseContext(canvas) {
    try {
      var gl = canvas.getContext("webgl2");
      var lose = gl && gl.getExtension("WEBGL_lose_context");
      if (lose) lose.loseContext();
    } catch (e) { /* nothing to release */ }
  }
  function releaseContexts(container) {
    releasing = true;
    Array.prototype.forEach.call(container.querySelectorAll("canvas"), releaseContext);
    releasing = false;
  }
  var releasing = false;
  function webglAvailable() {
    try {
      var probe = document.createElement("canvas");
      var ok = !!probe.getContext("webgl2");
      releaseContext(probe);
      return ok;
    } catch (e) { return false; }
  }
  var webglSupported = webglAvailable();
  var webglOn = webglSupported && elements.length > WEBGL_THRESHOLD;
  var webglManual = false;   // true once the user has used the checkbox; the size rule then stays out of the way

  // The layouts start from random positions. They are seeded from the graph, so the same report always draws the
  // same picture: layouts run with Math.random replaced by a generator that starts from the same state every time.
  function prng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var SEED = (function () {
    var h = 2166136261;
    data.nodes.forEach(function (n) {
      String(n.id).split("").forEach(function (ch) { h = Math.imul(h ^ ch.charCodeAt(0), 16777619); });
    });
    return h ^ data.edges.length;
  })();
  var jitter = prng(SEED);
  function seeded(run) {
    var real = Math.random;
    Math.random = prng(SEED);
    try { return run(); } finally { Math.random = real; }
  }

  // ---- Layouts ----------------------------------------------------------------------------------------------
  // Every layout works from the node sizes measured in desired() (data w and h), places each node and leaves the view
  // to applyLayout, which fits it. All are deterministic for a given graph.
  //
  // "Tiers" are how many hops a group is from the outside along the rule direction (an edge points the way traffic is
  // allowed to flow): external peers (CIDRs, IPv6 ranges, prefix lists) are tier 0, a group they reach directly is
  // tier 1, what that group reaches is tier 2, and so on. Groups nothing external reaches start at tier 1.
  var layoutName = "fcose";
  var TIER_GAP = 140;    // space between tier columns of the force layout
  var PEER_GAP = 180;    // space between the external peers' column and the first tier
  var MAX_TIER = 3;      // the force layout lines up external -> entry -> app -> data; longer chains are left free
  var LEAF_PAD = 16;     // a node's box is its size plus the 8px padding of the node style on each side
  var BOX_PAD = 18;      // room a VPC box needs around its groups (its padding plus the border)
  var BOX_LABEL = 22;    // and above them, for the VPC's name

  function isPeer(n) { return n.data("kind") === "group" && !vpcOf[n.id()]; }
  function isPublic(n) { return n.id() === "0.0.0.0/0" || n.id() === "::/0"; }
  function byLabel(a, b) {
    var x = String(a.data("label")), y = String(b.data("label"));
    return x < y ? -1 : x > y ? 1 : (a.id() < b.id() ? -1 : 1);
  }

  function successors() {
    var out = {};
    cy.edges().forEach(function (e) {
      var s = e.source().id(), t = e.target().id();
      if (s !== t) (out[s] = out[s] || []).push(t);
    });
    return out;
  }
  function pointedAt() {
    var set = {};
    cy.edges().forEach(function (e) { if (e.source() !== e.target()) set[e.target().id()] = true; });
    return set;
  }
  // Breadth-first from the ids already in `dist` (in queue order), following the rule direction.
  function spread(dist, queue, out) {
    for (var i = 0; i < queue.length; i++) {
      (out[queue[i]] || []).forEach(function (t) {
        if (!(t in dist)) { dist[t] = dist[queue[i]] + 1; queue.push(t); }
      });
    }
  }
  function tiers() {
    var out = successors(), dist = {}, queue = [];
    var leaves = cy.nodes().filter(function (n) { return !n.isParent(); });
    leaves.filter(isPeer).forEach(function (n) { dist[n.id()] = 0; queue.push(n.id()); });
    spread(dist, queue, out);
    var into = pointedAt();
    // Nothing external reaches these: start from the ones no rule points at, then from whatever is left (a cycle).
    [function (n) { return !into[n.id()]; }, function () { return true; }].forEach(function (pick) {
      leaves.forEach(function (n) {
        if (n.id() in dist || !pick(n)) return;
        dist[n.id()] = 1;
        spread(dist, [n.id()], out);
      });
    });
    return dist;
  }

  // fcose options for the given leaf nodes: a rule that leads from one tier to a later one (up to tier 3) inside a VPC (or at the
  // top level) puts its source to the left of its target, so the tiers line up as columns without being forced into
  // straight stacks; with `withPeers` the external peers share a column to the left of all.
  function fcoseOptions(leaves, extra, withPeers) {
    var tier = tiers(), peers = [], seen = {}, rel = [];
    var ids = {};
    leaves.forEach(function (n) { ids[n.id()] = n; if (isPeer(n)) peers.push(n.id()); });
    function parentOf(n) { return n.parent().length ? n.parent().id() : ""; }
    cy.edges().forEach(function (e) {
      var a = e.source(), b = e.target();
      if (!ids[a.id()] || !ids[b.id()] || tier[a.id()] >= tier[b.id()] || tier[b.id()] > MAX_TIER) return;
      var peerEdge = isPeer(a) && withPeers;
      if (!peerEdge && (isPeer(a) || parentOf(a) !== parentOf(b))) return;
      var key = a.id() + ">" + b.id();
      if (seen[key]) return;
      seen[key] = true;
      rel.push({ left: a.id(), right: b.id(), gap: peerEdge ? PEER_GAP : TIER_GAP });
    });
    var o = Object.assign({}, LAYOUT, { randomize: true }, extra);
    if (withPeers && peers.length > 1) o.alignmentConstraint = { vertical: [peers] };
    if (rel.length) o.relativePlacementConstraint = rel;
    return o;
  }
  function runFcose() {
    var leaves = cy.nodes().filter(function (n) { return !n.isParent(); });
    // fcose reads the positions it is given, so every run starts from the same ones: a layout picked again draws
    // what the first load drew.
    cy.batch(function () { leaves.forEach(function (n) { n.position({ x: 0, y: 0 }); }); });
    try {
      cy.layout(fcoseOptions(leaves, {}, true)).run();
    } catch (e) {
      // Constraints fcose cannot satisfy: lay out without them.
      cy.layout(Object.assign({}, LAYOUT, { randomize: true })).run();
    }
    separate();
  }

  // Stack the external peers in one column left of everything else, each at the height of the groups it talks to.
  function stackPeers(peers) {
    if (peers.empty()) return;
    var rest = cy.nodes().not(peers);
    var bb = rest.nonempty() ? rest.boundingBox({ includeLabels: true, includeOverlays: false }) : { x1: 0, x2: 0, y1: 0, y2: 0 };
    var want = peers.map(function (n) {
      var near = n.neighborhood("node").not(peers);
      var y = near.nonempty() ? near.reduce(function (sum, m) { return sum + m.position("y"); }, 0) / near.length : (bb.y1 + bb.y2) / 2;
      return { n: n, y: y };
    });
    want.sort(function (a, b) { return a.y - b.y || byLabel(a.n, b.n); });
    var widest = Math.max.apply(null, want.map(function (w) { return w.n.data("w"); }));
    var prev = null;
    want.forEach(function (w) {
      var h = w.n.data("h");
      if (prev) w.y = Math.max(w.y, prev.y + prev.h / 2 + LEAF_PAD + GAP + h / 2);
      prev = { y: w.y, h: h };
    });
    var shift = (bb.y1 + bb.y2) / 2 - (want[0].y + want[want.length - 1].y) / 2;
    cy.batch(function () {
      want.forEach(function (w) { w.n.position({ x: bb.x1 - 80 - widest / 2, y: w.y + shift }); });
    });
  }

  // Layered along the rule direction, left to right: entry groups, then what they reach, and so on. With VPCs open,
  // each VPC is laid out on its own (dagre, left to right inside the box) and the boxes are packed in rows, so a large
  // account is a page and not a strip; with every VPC collapsed, dagre ranks the VPC nodes themselves. Edges to the
  // external peers are left out of the ranking (every group allows egress to 0.0.0.0/0 by default and would collapse
  // the layers), and the peers get their own column on the left instead.
  function runFlow() {
    if (cy.nodes(".vpc:parent").nonempty()) { runPacked(true); return; }
    var peers = cy.nodes().filter(isPeer);
    var rest = cy.elements().not(peers).not(peers.connectedEdges());
    var opts = { name: "dagre", rankDir: "LR", nodeSep: 24, rankSep: 110, edgeSep: 10, animate: false, fit: false, nodeDimensionsIncludeLabels: false };
    try {
      rest.layout(opts).run();
    } catch (e) {
      // dagre can fail on some nested shapes: rank the groups without their boxes; the boxes follow their groups.
      rest.not(":parent").layout(opts).run();
    }
    separate(undefined, peers);
    stackPeers(peers);
  }

  // Rings by hop distance from the internet: the public peers (0.0.0.0/0, ::/0) in the middle, the groups they
  // reach directly on the first ring, and so on; groups nothing external reaches are on the outermost ring. The
  // groups of one VPC sit next to each other on a ring. Rings cannot respect VPC boxes, so those are not drawn.
  function ringOf() {
    var out = successors(), dist = {}, queue = [];
    var leaves = cy.nodes().filter(function (n) { return !n.isParent(); });
    var pub = leaves.filter(function (n) { return isPeer(n) && isPublic(n); });
    var other = leaves.filter(function (n) { return isPeer(n) && !isPublic(n); });
    var sources = pub.nonempty() ? [pub, other] : (other.nonempty() ? [other] : []);
    sources.forEach(function (list, i) {
      list.forEach(function (n) { dist[n.id()] = i; queue.push(n.id()); });
    });
    if (!sources.length) {
      var into = pointedAt();
      leaves.forEach(function (n) { if (!into[n.id()]) { dist[n.id()] = 0; queue.push(n.id()); } });
    }
    spread(dist, queue, out);
    var far = Object.keys(dist).reduce(function (m, id) { return Math.max(m, dist[id]); }, 0) + 1;
    leaves.forEach(function (n) { if (!(n.id() in dist)) dist[n.id()] = far; });
    return dist;
  }
  function runRings() {
    var ring = ringOf(), byRing = {};
    cy.nodes().filter(function (n) { return !n.isParent(); }).forEach(function (n) {
      (byRing[ring[n.id()]] = byRing[ring[n.id()]] || []).push(n);
    });
    // Rings are a node's width apart, so a node never reaches the next ring where the ring runs sideways.
    var step = cy.nodes().filter(function (n) { return !n.isParent(); }).reduce(function (m, n) { return Math.max(m, n.data("w")); }, 0) + 100;
    var radius = 0;
    var leaves = cy.nodes().filter(function (n) { return !n.isParent(); });
    cy.batch(function () {
      Object.keys(byRing).map(Number).sort(function (a, b) { return a - b; }).forEach(function (r, i) {
        var nodes = byRing[r].sort(function (a, b) {
          var pa = vpcOf[a.id()] || "", pb = vpcOf[b.id()] || "";
          return pa < pb ? -1 : pa > pb ? 1 : byLabel(a, b);
        });
        if (i === 0 && nodes.length <= 6) {
          // The middle: the public peers sit together at the centre, one above the other.
          nodes.forEach(function (n, k) { n.position({ x: 0, y: (k - (nodes.length - 1) / 2) * (n.data("h") + LEAF_PAD + GAP) }); });
          return;
        }
        var around = nodes.reduce(function (sum, n) { return sum + n.data("w") + GAP * 2 + LEAF_PAD; }, 0);
        radius = Math.max(radius + step, around / (2 * Math.PI));
        var at = 0;
        nodes.forEach(function (n) {
          var arc = n.data("w") + GAP * 2 + LEAF_PAD;
          var angle = -Math.PI / 2 + ((at + arc / 2) / around) * 2 * Math.PI;
          at += arc;
          n.position({ x: Math.cos(angle) * radius, y: Math.sin(angle) * radius });
        });
      });
    });
    // Nodes of neighbouring rings can still touch where a wide label meets a bend of the ring.
    pushApart(leaves.toArray());
  }

  // Each VPC's groups in a grid, a row per tier (a long tier wraps), the VPCs side by side in rows, and the external
  // peers in a column on the left. Boxes are sized here from the node sizes, so the layout does not depend on a
  // renderer.
  function runGrid() { runPacked(false); }
  function runPacked(flow) {
    var tier = tiers();
    function byTierThenLabel(a, b) { return (tier[a.id()] - tier[b.id()]) || byLabel(a, b); }
    function leafBox(n) {
      return { w: n.data("w"), h: n.data("h"), put: function (x, y) { n.position({ x: x + this.w / 2, y: y + this.h / 2 }); } };
    }
    // Boxes in rows no wider than `wide`, left to right, top to bottom; each gets its offset in `at`.
    function rows(boxes, wide, pad) {
      var x = 0, y = 0, rowH = 0, maxX = 0;
      boxes.forEach(function (b) {
        if (x > 0 && x + b.w > wide) { x = 0; y += rowH + pad; rowH = 0; }
        b.at = { x: x, y: y };
        x += b.w + pad;
        rowH = Math.max(rowH, b.h);
        maxX = Math.max(maxX, x - pad);
      });
      return { w: maxX, h: y + rowH };
    }
    function packed(boxes, pad) {
      if (!boxes.length) return { w: 0, h: 0, put: function () {} };
      var area = boxes.reduce(function (sum, b) { return sum + (b.w + pad) * (b.h + pad); }, 0);
      var widest = Math.max.apply(null, boxes.map(function (b) { return b.w; }));
      var size = rows(boxes, Math.max(Math.sqrt(area) * 1.6, widest), pad);
      return { w: size.w, h: size.h, put: function (x, y) { boxes.forEach(function (b) { b.put(x + b.at.x, y + b.at.y); }); } };
    }
    function flowBox(v) {
      var kids = v.children();
      try {
        kids.union(kids.edgesWith(kids)).layout({ name: "dagre", rankDir: "LR", nodeSep: 24, rankSep: 90, edgeSep: 10, animate: false, fit: false, nodeDimensionsIncludeLabels: false }).run();
      } catch (e) {
        return gridBox(v);
      }
      var bb = kids.boundingBox({ includeLabels: false, includeOverlays: false });
      return {
        w: bb.w + 2 * BOX_PAD, h: bb.h + 2 * BOX_PAD + BOX_LABEL,
        put: function (x, y) { kids.shift({ x: x + BOX_PAD - bb.x1, y: y + BOX_PAD + BOX_LABEL - bb.y1 }); }
      };
    }
    function vpcBox(v) { return flow ? flowBox(v) : gridBox(v); }
    function gridBox(v) {
      var kids = v.children().toArray().sort(byTierThenLabel);
      var cw = Math.max.apply(null, kids.map(function (n) { return n.data("w"); })) + GAP * 2;
      var ch = Math.max.apply(null, kids.map(function (n) { return n.data("h"); })) + 26;
      var cols = Math.max(3, Math.ceil(Math.sqrt(kids.length) * 1.4));
      var row = -1, col = 0, last = null, cells = [], wide = 0;
      kids.forEach(function (n) {
        if (tier[n.id()] !== last || col >= cols) { row++; col = 0; last = tier[n.id()]; }
        cells.push({ n: n, col: col, row: row });
        col++;
        wide = Math.max(wide, col);
      });
      return {
        w: wide * cw + 2 * BOX_PAD, h: (row + 1) * ch + 2 * BOX_PAD + BOX_LABEL,
        put: function (x, y) {
          cells.forEach(function (c) {
            c.n.position({ x: x + BOX_PAD + c.col * cw + cw / 2, y: y + BOX_PAD + BOX_LABEL + c.row * ch + ch / 2 });
          });
        }
      };
    }
    function boxOf(n) {
      if (!n.isParent()) return leafBox(n);
      if (n.hasClass("vpc")) return vpcBox(n);
      var inner = packed(n.children().toArray().sort(byLabel).map(boxOf), GAP * 2);
      return { w: inner.w + 2 * BOX_PAD, h: inner.h + 2 * BOX_PAD + BOX_LABEL, put: function (x, y) { inner.put(x + BOX_PAD, y + BOX_PAD + BOX_LABEL); } };
    }
    var peers = cy.nodes().filter(isPeer);
    var top = cy.nodes(":orphan").not(peers).toArray().sort(function (a, b) { return (b.isParent() - a.isParent()) || byLabel(a, b); });
    // The boxes are measured (and, in the flow layout, laid out) before anything is moved.
    var main = packed(top.map(boxOf), GAP * 3);
    var peerBoxes = peers.toArray().sort(byLabel).map(leafBox);
    var column = rows(peerBoxes, 0, GAP * 2);
    var widest = peerBoxes.reduce(function (m, b) { return Math.max(m, b.w); }, 0);
    cy.batch(function () {
      if (flow) {
        main.put(0, 0);
      } else {
        peerBoxes.forEach(function (b) { b.put((widest - b.w) / 2, b.at.y + Math.max(0, (main.h - column.h) / 2)); });
        main.put(widest + PEER_GAP / 2, 0);
      }
    });
    separate(undefined, peers);
    if (flow) stackPeers(peers);
  }

  var LAYOUTS = { fcose: { run: runFcose }, flow: { run: runFlow }, rings: { run: runRings, flat: true }, grid: { run: runGrid } };
  // Lay the whole graph out with the named layout and fit it. Collapse state, selection, search and the toggles are
  // untouched: a layout only moves nodes.
  function applyLayout(name) {
    layoutName = name;
    var spec = LAYOUTS[name];
    cy.nodes(".vpc, .region").toggleClass("flat", !!spec.flat);
    // Whether a label counts toward a node's size depends on the zoom (see min-zoomed-font-size), so the layout always
    // starts from the same view: the same picture whatever the zoom was when it was picked.
    cy.viewport({ zoom: 1, pan: { x: 0, y: 0 } });
    seeded(spec.run);
    unselectFlat();
    cy.fit(undefined, 30);
    var box = document.getElementById("layout");
    if (box.value !== name) box.value = name;
  }
  document.getElementById("layout").addEventListener("change", function (evt) {
    applyLayout(evt.target.value);
    // A path shown on the old picture is put back with this one's view.
    if (pathState) { pathState.zoom = cy.zoom(); pathState.pan = Object.assign({}, cy.pan()); }
  });

  var cy;
  // Cytoscape fixes the renderer when it is created, so switching renderer means creating it again.
  function createCy(els, extra) {
    var opts = Object.assign({
      container: document.getElementById("cy"),
      elements: els,
      wheelSensitivity: 0.3,
      style: STYLE
    }, extra);
    if (webglOn) {
      try {
        cy = cytoscape(Object.assign({}, opts, { webgl: true }));
        return;
      } catch (e) {
        // The half-built instance cannot be reached, so clear what it left in the container.
        webglOn = false;
        webglSupported = false;
        releaseContexts(opts.container);
        opts.container.textContent = "";
      }
    }
    cy = cytoscape(opts);
  }
  createCy(elements, { layout: { name: "preset" } });
  applyLayout("fcose");

  syncWebglBox();
  expose();

  // Until the user moves the view, keep the whole graph fitted: the container can still be settling when the first
  // fit runs, so fit again once it has its final size.
  var userMoved = false;
  ["wheel", "mousedown", "touchstart", "keydown"].forEach(function (type) {
    document.getElementById("cy").addEventListener(type, function () { userMoved = true; }, true);
  });
  function refit() {
    if (userMoved) return;
    cy.resize();
    cy.fit(undefined, 30);
  }
  if (window.ResizeObserver) new ResizeObserver(refit).observe(document.getElementById("cy"));
  requestAnimationFrame(function () { requestAnimationFrame(refit); });

  var details = document.getElementById("details");

  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text !== undefined) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }
  function field(label, value) {
    var p = el("p");
    p.appendChild(el("strong", label + ": "));
    p.appendChild(document.createTextNode(value));
    return p;
  }
  function shownMembers(e) {
    var all = e.data("members");
    return document.getElementById("risky-only").checked ? e.data("riskyMembers") : all;
  }
  // Ports of an edge; a merged edge lists the ports of the rules it stands for.
  function edgePorts(e) {
    if (!e.data("meta")) return e.data("label") || "all";
    var seen = [];
    shownMembers(e).forEach(function (id) { var p = edgeData[id].label || "all"; if (seen.indexOf(p) === -1) seen.push(p); });
    return seen.join(", ");
  }
  function describeEdges(title, edges, other) {
    var box = document.createDocumentFragment();
    if (!edges.length) return box;
    box.appendChild(el("h3", title));
    var ul = el("ul");
    edges.forEach(function (e) {
      var li = el("li");
      li.appendChild(document.createTextNode(other(e).data("label") + " : " + edgePorts(e)));
      if (e.data("risky")) li.appendChild(el("span", " (risky)", "risky"));
      ul.appendChild(li);
    });
    box.appendChild(ul);
    return box;
  }
  function descriptionList(descs) {
    var ul = el("ul");
    (descs || []).forEach(function (d) {
      ul.appendChild(el("li", (d.ports ? d.ports + ": " : "") + d.text));
    });
    return ul;
  }
  var edgeData = {};
  data.edges.forEach(function (e) { edgeData[e.id] = e; });

  function nodeLabel(id) { return nodeById[id] ? nodeById[id].label : id; }

  // The way to close a VPC where its box cannot be double-clicked (exposure rings), and a plain button elsewhere.
  function collapseButton(vpcId) {
    var close = el("button", "Collapse " + parentDefs[vpcId].data.name);
    close.type = "button";
    close.addEventListener("click", function () { if (!collapsed[vpcId]) toggleVpc(vpcId); });
    return close;
  }

  var shownId = null;   // element whose details are on the panel
  function show(target) {
    shownId = target.id();
    details.textContent = "";
    if (target.isEdge() && target.data("meta")) {
      details.appendChild(el("h2", target.source().data("label") + " -> " + target.target().data("label")));
      details.appendChild(field("Direction", target.data("kind")));
      details.appendChild(field("Merged rules", String(target.data("members").length)));
      if (target.data("risky")) details.appendChild(el("p", "Includes a risky public ingress rule", "risky"));
      var ids = shownMembers(target);
      var list = el("ul");
      ids.forEach(function (id) {
        var m = edgeData[id];
        var li = el("li", nodeLabel(m.source) + " -> " + nodeLabel(m.target) + " : " + (m.label || "all"));
        if (m.risky) li.appendChild(el("span", " (risky)", "risky"));
        list.appendChild(li);
      });
      details.appendChild(list);
      appendDescriptions(ids);
      return;
    }
    if (target.isEdge()) {
      var e = edgeData[target.id()];
      details.appendChild(el("h2", target.source().data("label") + " -> " + target.target().data("label")));
      details.appendChild(field("Direction", e.kind));
      details.appendChild(field("Ports", e.label || "all"));
      if (e.risky) details.appendChild(el("p", "Risky: public ingress on a sensitive port or all traffic", "risky"));
      if (e.descriptions && e.descriptions.length) {
        details.appendChild(el("h3", "Rule descriptions"));
        details.appendChild(descriptionList(e.descriptions));
      }
      return;
    }
    var n = nodeById[target.id()];
    if (!n) {
      details.appendChild(el("h2", target.data("label")));
      details.appendChild(field("Type", target.data("kind").toUpperCase()));
      if (vpcGroups[target.id()]) {
        details.appendChild(field("Groups", String(vpcGroups[target.id()].length)));
        if (collapsed[target.id()]) {
          details.appendChild(el("p", "Collapsed: double-click to expand.", "muted"));
        } else {
          // Double-click needs a box that takes events; the exposure rings draw none, so only the button works there.
          if (!LAYOUTS[layoutName].flat) details.appendChild(el("p", "Double-click to collapse.", "muted"));
          details.appendChild(collapseButton(target.id()));
        }
        if (collapsed[target.id()]) {
          details.appendChild(field("Internal rules", String(target.data("internal"))));
          if (target.data("internalRisky")) details.appendChild(el("p", target.data("internalRisky") + " internal rule(s) are risky", "risky"));
          details.appendChild(describeEdges("Incoming", riskyFilter(target.incomers("edge").toArray()), function (e) { return e.source(); }));
          details.appendChild(describeEdges("Outgoing", riskyFilter(target.outgoers("edge").toArray()), function (e) { return e.target(); }));
          appendDescriptions(descriptionIds(target));
        }
      }
      return;
    }
    details.appendChild(el("h2", n.label));
    details.appendChild(field("Id", n.id));
    if (n.vpc) details.appendChild(field("VPC", n.vpc));
    if (vpcOf[n.id]) {
      details.appendChild(collapseButton(vpcOf[n.id]));
    }
    if (n.region) details.appendChild(field("Region", n.region));
    if (n.unused) details.appendChild(el("p", "Unused: no network interfaces attached", "muted"));
    details.appendChild(describeEdges("Incoming", riskyFilter(target.incomers("edge").toArray()), function (e) { return e.source(); }));
    details.appendChild(describeEdges("Outgoing", riskyFilter(target.outgoers("edge").toArray()), function (e) { return e.target(); }));
    appendDescriptions(descriptionIds(target));
  }

  // With Risky only on, the lists in the details panel leave out the edges the canvas hides.
  function riskyFilter(edges) {
    return document.getElementById("risky-only").checked ? edges.filter(function (e) { return e.data("risky"); }) : edges;
  }
  // Real edges behind everything connected to a node, merged edges included.
  function descriptionIds(target) {
    var ids = [];
    riskyFilter(target.connectedEdges().toArray()).forEach(function (e) { ids = ids.concat(e.data("meta") ? shownMembers(e) : [e.id()]); });
    return ids;
  }

  // Rule descriptions of the given real edges, each under its own source -> target heading.
  function appendDescriptions(ids) {
    var withDescs = ids.filter(function (id) { var d = edgeData[id].descriptions; return d && d.length; });
    if (!withDescs.length) return;
    details.appendChild(el("h3", "Rule descriptions"));
    withDescs.forEach(function (id) {
      details.appendChild(el("p", nodeLabel(edgeData[id].source) + " -> " + nodeLabel(edgeData[id].target), "muted"));
      details.appendChild(descriptionList(edgeData[id].descriptions));
    });
  }

  function clearFocus() { cy.elements().removeClass("dim show-label"); }
  function unselectFlat() { cy.nodes(":parent.flat").unselect(); }
  function focus(target) {
    clearFocus();
    // Port labels are hidden until needed: the selected node's own edges (or the selected edge) show theirs.
    (target.isNode() ? target.connectedEdges() : target).addClass("show-label");
    // Their labels (and the neighbours') are readable at any zoom.
    (target.isNode() ? target.closedNeighborhood("node") : target.connectedNodes()).addClass("show-label");
    var keep = target.isNode() ? target.closedNeighborhood().union(target.ancestors()).union(target.neighborhood().ancestors()) : target.union(target.connectedNodes()).union(target.connectedNodes().ancestors());
    cy.elements().not(keep).addClass("dim");
  }

  function onTapElement(evt) {
    var t = evt.target;
    if (t.isNode() && t.isParent()) { show(t); return; }
    show(t);
    // The path highlight stays while a path is shown.
    if (!pathState) focus(t);
  }
  function onTapBackground(evt) {
    if (evt.target === cy) {
      if (pathState) { shownId = null; pathState.render(); return; }
      clearFocus();
      shownId = null;
      showHint();
    }
  }
  function showHint() {
    details.textContent = "";
    details.appendChild(el("p", "Click a group or an edge to see its details.", "muted"));
  }
  // A layout change can alter what the panel says (a VPC collapsing, merged edges changing); say it again.
  function refreshDetails() {
    if (!shownId) return;
    var t = cy.getElementById(shownId);
    if (t.nonempty()) show(t); else { shownId = null; showHint(); }
  }
  function onDoubleTapVpc(evt) { toggleVpc(evt.target.id()); }
  function toggleVpc(id) {
    collapsed[id] = !collapsed[id];
    searchSnapshot = null;
    sync();
    if (!collapsed[id]) bringIntoView(cy.getElementById(id));
  }
  // An expanded VPC can run off the screen at the zoom of the collapsed view. Pan to it, and zoom out only as far as
  // needed; a VPC that is already on screen leaves the view alone.
  function bringIntoView(v) {
    var b = v.renderedBoundingBox({ includeLabels: true, includeOverlays: false });
    var pad = 40;
    if (b.x1 >= pad / 2 && b.y1 >= pad / 2 && b.x2 <= cy.width() - pad / 2 && b.y2 <= cy.height() - pad / 2) return;
    var zoom = cy.zoom();
    cy.fit(v, pad);
    if (cy.zoom() > zoom) { cy.zoom(zoom); cy.center(v); }
  }
  function bindCy() {
    cy.on("tap", "node, edge", onTapElement);
    cy.on("tap", onTapBackground);
    cy.on("dbltap", "node.vpc", onDoubleTapVpc);
    // A VPC that was just opened by a double-click is still being selected by the click that opened it.
    cy.on("select", "node:parent", function (evt) { if (evt.target.hasClass("flat")) evt.target.unselect(); });
    cy.on("mouseover", "edge", function (evt) { evt.target.addClass("hover"); });
    cy.on("mouseout", "edge", function (evt) { evt.target.removeClass("hover"); });
  }
  bindCy();

  function applyFilters() {
    var ingress = document.getElementById("ingress").checked;
    var egress = document.getElementById("egress").checked;
    var riskyOnly = document.getElementById("risky-only").checked;
    cy.edges().forEach(function (e) {
      var visible = e.hasClass("path") || ((e.data("kind") === "ingress" ? ingress : egress) && (!riskyOnly || e.data("risky")));
      if (e.data("meta")) {
        // A merged edge counts only the rules the current filters leave in.
        var n = shownMembers(e).length;
        e.data("label", n + (n === 1 ? " rule" : " rules"));
      }
      e.style("display", visible ? "element" : "none");
    });
  }
  ["ingress", "egress", "risky-only"].forEach(function (id) {
    document.getElementById(id).addEventListener("change", function () { applyFilters(); autoRenderer(); });
  });

  // Bring the canvas in line with `collapsed`. Only the VPCs that were just expanded are laid out again, each
  // on its own, and its groups start at the spot the collapsed node occupied; everything else keeps its place.
  function sync(skipLayout) {
    var want = desired();
    var wanted = {};
    want.nodes.concat(want.edges).forEach(function (def) { wanted[def.data.id] = true; });
    var centres = {};
    Object.keys(vpcGroups).forEach(function (id) {
      var v = cy.getElementById(id);
      if (v.nonempty()) centres[id] = Object.assign({}, v.position());
    });
    var stale = cy.elements().filter(function (x) { return !wanted[x.id()]; });
    var changed = stale.nonempty();
    cy.remove(stale.edges());
    cy.remove(stale.nodes());
    var expanded = [];
    want.nodes.forEach(function (def) {
      var existing = cy.getElementById(def.data.id);
      if (existing.nonempty()) {
        if (vpcGroups[def.data.id]) {
          var wasCollapsed = existing.hasClass("collapsed");
          existing.data({ label: def.data.label, w: def.data.w, h: def.data.h, internal: def.data.internal, internalRisky: def.data.internalRisky });
          existing.toggleClass("collapsed", !!collapsed[def.data.id]);
          if (!collapsed[def.data.id] && wasCollapsed) expanded.push(def.data.id);
          else if (collapsed[def.data.id] && !wasCollapsed) existing.position(centres[def.data.id]);
        }
        return;
      }
      var at = vpcOf[def.data.id] && centres[vpcOf[def.data.id]];
      changed = true;
      cy.add(at ? Object.assign({}, def, { position: { x: at.x + jitter() * 20, y: at.y + jitter() * 20 } }) : def);
    });
    want.edges.forEach(function (def) {
      if (cy.getElementById(def.data.id).empty()) { changed = true; cy.add(def); }
    });
    if (!skipLayout) {
      // The force layout is local: an expanded VPC is laid out on its own. The others are a function of the whole
      // graph, so they are laid out again when it changed.
      if (layoutName === "fcose") expanded.forEach(function (id) { layoutVpc(id, centres[id]); });
      else if (changed) applyLayout(layoutName);
    }
    clearFocus();
    unselectFlat();
    applyFilters();
    autoRenderer();
    refreshDetails();
    if (pathState) markPath();
  }

  function layoutVpc(id, centre) {
    var v = cy.getElementById(id);
    var eles = v.union(v.children());
    var layout = eles.layout(fcoseOptions(v.children(), { fit: false, packComponents: false }));
    layout.one("layoutstop", function () {
      var now = v.position();
      v.children().shift({ x: centre.x - now.x, y: centre.y - now.y });
    });
    seeded(function () { layout.run(); });
    separate(id);
  }

  // fcose can leave sibling boxes (VPCs, collapsed VPCs, peers, groups) overlapping, so after a layout the
  // overlapping siblings are pushed apart, level by level from the innermost out. A pinned VPC stays where it is
  // and its neighbours move instead.
  // `skip` is a collection of nodes to leave out (the external peers, which a layout places on its own).
  function separate(pinnedId, skip) {
    var levels = [];
    function keep(n) { return !skip || !skip.contains(n); }
    cy.nodes().filter(function (n) { return n.isParent(); }).forEach(function (n) {
      levels.push({ depth: n.ancestors().length, nodes: n.children().toArray() });
    });
    levels.sort(function (a, b) { return b.depth - a.depth; });
    levels.push({ depth: -1, nodes: cy.nodes(":orphan").toArray().filter(keep) });
    levels.forEach(function (level) { pushApart(level.nodes, pinnedId); });
  }
  function pushApart(nodes, pinnedId) {
    if (nodes.length < 2) return;
    var boxes = nodes.map(function (n) {
      var b = n.boundingBox({ includeLabels: true, includeOverlays: false });
      return { x1: b.x1, y1: b.y1, x2: b.x2, y2: b.y2, dx: 0, dy: 0, pinned: n.id() === pinnedId };
    });
    function move(box, dx, dy) { box.x1 += dx; box.x2 += dx; box.y1 += dy; box.y2 += dy; box.dx += dx; box.dy += dy; }
    for (var round = 0; round < 3000; round++) {
      // Pushing one box off another can push it onto a third; a growing step breaks such cycles.
      var step = 1 + round / 100;
      var moved = false;
      for (var i = 0; i < boxes.length; i++) {
        for (var j = i + 1; j < boxes.length; j++) {
          var a = boxes[i], b = boxes[j];

      });
      res.reasons = uniq(res.reasons);
      res.parts = uniq(res.parts);
    }
    cache[key] = res;
    return res;
  }
  function uniq(list) {
    var out = [];
    list.forEach(function (x) { if (x && out.indexOf(x) === -1) out.push(x); });
    return out;
  }
  function accepted(h, allowMaybe) { return !!h && (h.status === "yes" || (allowMaybe && h.status === "maybe")); }

  // Breadth-first over the groups. Only groups with rules carry traffic onward: an endpoint is the first node or the last.
  function search(from, to, f, allowMaybe, cache) {
    var dist = {}, prev = {}, queue = [from];
    dist[from.id] = 0;
    for (var i = 0; i < queue.length && !(to.id in dist); i++) {
      var X = queue[i];
      var candidates = X.type === "group" ? uniq((ingressByPeer[X.id] || []).concat(ingressOpen)) : groupList;
      if (candidates.indexOf(to) === -1) candidates = candidates.concat([to]);
      candidates.forEach(function (Y) {
        if (Y.id in dist || Y === X) return;
        var h = hop(X, Y, f, cache);
        if (!accepted(h, allowMaybe)) return;
        dist[Y.id] = dist[X.id] + 1;
        prev[Y.id] = h;
        queue.push(Y);
      });
    }
    if (!(to.id in dist)) return null;
    var hops = [];
    for (var at = to.id; at !== from.id; at = prev[at].from.id) hops.unshift(prev[at]);
    return hops;
  }
  // When nothing gets through: the path with the fewest blocked hops (a blocked hop is one where a rule on at least
  // one side names the other end), so the report names the hop that actually stops the traffic.
  var BLOCKED_COST = 1000;
  function closest(from, to, f, cache) {
    var cost = {}, prev = {}, done = {}, open = [from];
    cost[from.id] = 0;
    while (open.length) {
      var best = 0;
      open.forEach(function (n, k) { if (cost[n.id] < cost[open[best].id]) best = k; });
      var X = open.splice(best, 1)[0];
      if (done[X.id]) continue;
      done[X.id] = true;
      if (X === to) break;
      var candidates = X.type === "group"
        ? uniq((ingressByPeer[X.id] || []).concat(ingressOpen, X.out.filter(function (r) { return r.kind === "group" && nodeInfo[r.peer]; }).map(function (r) { return nodeInfo[r.peer]; })))
        : groupList;
      if (candidates.indexOf(to) === -1) candidates = candidates.concat([to]);
      candidates.forEach(function (Y) {
        if (done[Y.id] || Y === X || (Y !== to && Y.type !== "group")) return;
        var h = hop(X, Y, f, cache);
        if (!h) return;
        var step = accepted(h, true) ? 1 : (h.named || (h.egressOk && h.ingressOk) ? BLOCKED_COST : 0);
        if (!step) return;
        if (!(Y.id in cost) || cost[X.id] + step < cost[Y.id]) {
          cost[Y.id] = cost[X.id] + step;
          prev[Y.id] = h;
          open.push(Y);
        }
      });
    }
    if (!(to.id in cost)) return null;
    var hops = [];
    for (var at = to.id; at !== from.id; at = prev[at].from.id) hops.unshift(prev[at]);
    return hops;
  }
  // The verdict: reachable (every hop certain), possible (some hop depends on what the data cannot tell) or blocked,
  // with the hop that stops the traffic on the closest path.
  function analyse(from, to, f) {
    var cache = {}, hops;
    if (from === to) {
      var self = hop(from, from, f, cache);
      if (accepted(self, true)) return { verdict: self.status === "yes" ? "reachable" : "possible", hops: [self] };
      return { verdict: "blocked", blocked: self, reach: 0 };
    }
    if ((hops = search(from, to, f, false, cache))) return { verdict: "reachable", hops: hops };
    if ((hops = search(from, to, f, true, cache))) return { verdict: "possible", hops: hops };
    hops = closest(from, to, f, cache);
    if (!hops) return { verdict: "blocked", blocked: null };
    var k = 0;
    while (k < hops.length && accepted(hops[k], true)) k++;
    return { verdict: "blocked", blocked: hops[k], reach: k };
  }

  function portNote(f) { return f ? " on port " + f.text : ""; }
  function showPathMessage(title, lines) {
    details.textContent = "";
    details.appendChild(el("h2", title));
    lines.forEach(function (l) { details.appendChild(el("p", l.text, l.cls)); });
  }
  function ruleList(rules) {
    var ul = el("ul");
    rules.forEach(function (r) {
      var li = el("li", ruleText(r));
      if (r.desc) li.appendChild(el("span", " - " + r.desc, "muted"));
      ul.appendChild(li);
    });
    return ul;
  }
  var NOT_CHECKED = "Security groups only: network ACLs, route tables, peering and gateways are not checked.";
  function showPathResult(res, f) {
    details.textContent = "";
    var n = res.hops.length, first = res.hops[0].from, last = res.hops[n - 1].to;
    var parts = uniq([].concat.apply([], res.hops.map(function (h) { return h.parts; })));
    details.appendChild(el("h2", first.label + " -> " + last.label));
    if (res.verdict === "reachable") {
      details.appendChild(el("p", "Reachable in " + n + (n === 1 ? " hop" : " hops") + portNote(f) + ": every hop is allowed by both the egress rules of its source and the ingress rules of its target."));
    } else {
      details.appendChild(el("p", "Possibly reachable in " + n + (n === 1 ? " hop" : " hops") + portNote(f) + ": at least one hop depends on something the data cannot tell" + (parts.length ? ": " + parts.join("; ") : "") + ".", "risky"));
    }
    res.hops.forEach(function (h, i) {
      details.appendChild(el("h3", "Hop " + (i + 1) + ": " + h.from.label + " -> " + h.to.label + (h.status === "maybe" ? " (possible)" : "")));
      if (h.egress.length) { details.appendChild(el("p", "Egress on " + h.from.label, "muted")); details.appendChild(ruleList(h.egress)); }
      if (h.ingress.length) { details.appendChild(el("p", "Ingress on " + h.to.label, "muted")); details.appendChild(ruleList(h.ingress)); }
      details.appendChild(field("Allowed ports", itemsText(h.items)));
      h.reasons.forEach(function (r) { details.appendChild(el("p", r, "muted")); });
    });
    details.appendChild(el("p", f ? "Every hop allows port " + f.text + "." : "Ports are listed per hop; the ports open along the whole path are not computed. Enter a port to ask about one.", "muted"));
    details.appendChild(el("p", NOT_CHECKED, "muted"));
  }
  function showBlocked(from, to, res, f) {
    var lines = [{ text: from.label + " cannot reach " + to.label + portNote(f) + "." }];
    var h = res.blocked;
    if (!h) {
      lines.push({ text: "No rule on either side names the other, so nothing connects them.", cls: "muted" });
    } else {
      lines.push({ text: "Nearest blocked hop: " + h.from.label + " -> " + h.to.label + (res.reach ? " (" + h.from.label + " is reachable from " + from.label + " in " + res.reach + (res.reach === 1 ? " hop)." : " hops).") : ".") });
      if (!h.egressOk) lines.push({ text: h.from.label + " has no egress rule that allows " + h.to.label + ". The missing side is the egress of " + h.from.label + "." });
      if (!h.ingressOk) lines.push({ text: h.to.label + " has no ingress rule that allows " + h.from.label + ". The missing side is the ingress of " + h.to.label + "." });
      if (h.egressOk && h.ingressOk && !h.overlap && h.famClash) lines.push({ text: "The egress rules of " + h.from.label + " and the ingress rules of " + h.to.label + " cover different address families (IPv4 on one side, IPv6 on the other), so no address satisfies both." });
      else if (h.egressOk && h.ingressOk && !h.overlap) lines.push({ text: "Egress on " + h.from.label + " allows " + itemsText(h.egressItems) + " and ingress on " + h.to.label + " allows " + itemsText(h.ingressItems) + ": nothing in common." });
      if (h.overlap && f) lines.push({ text: "Both sides agree on some traffic, but not on port " + f.text + "." });
    }
    lines.push({ text: NOT_CHECKED, cls: "muted" });
    showPathMessage("No path", lines);
  }
  function runPath() {
    var a = resolveNode(pathFrom.value), b = resolveNode(pathTo.value);
    var vague = [["source", a], ["target", b]].filter(function (x) { return x[1] && x[1].candidates; });
    if (vague.length) {
      showPathMessage("Ambiguous name", vague.map(function (x) {
        var c = x[1].candidates;
        return { text: "The " + x[0] + " matches " + c.length + " groups: " + c.slice(0, 5).join(", ") + (c.length > 5 ? ", ..." : "") + ". Type more of the name or pick one from the list." };
      }));
      return;
    }
    if (!a || !b) {
      showPathMessage("Pick a source and a target", [{ text: "Type a group name or id in both boxes and choose one from the list.", cls: "muted" }]);
      return;
    }
    var f = parsePortFilter(pathPort.value);
    if (f && f.bad) {
      showPathMessage("Unrecognised port", [{ text: "Use a port such as 443, 443/udp or 1000-2000, or icmp, icmp 8 or proto 50.", cls: "muted" }]);
      return;
    }
    var from = nodeInfo[a.id], to = nodeInfo[b.id];
    shownId = null;
    if (from === to && from.type !== "group") {
      clearPath(true);
      showPathMessage("Same endpoint", [{ text: "The source and the target are the same address range; no security group rule is involved.", cls: "muted" }]);
      return;
    }
    var res = analyse(from, to, f);
    if (res.verdict === "blocked") {
      clearPath(true);
      showBlocked(from, to, res, f);
      return;
    }
    if (!pathState) pathState = { collapsed: Object.assign({}, collapsed), zoom: cy.zoom(), pan: Object.assign({}, cy.pan()) };
    pathState.render = function () { showPathResult(res, f); };
    pathState.nodes = [from.id].concat(res.hops.map(function (h) { return h.to.id; }));
    pathState.edgeIds = {};
    pathState.via = {};
    res.hops.forEach(function (h) {
      h.egress.forEach(function (r) { pathState.edgeIds[h.from.id + "-" + (r.node || r.peer)] = true; pathState.via[r.node || r.peer] = true; });
      h.ingress.forEach(function (r) { pathState.edgeIds[(r.node || r.peer) + "-" + h.to.id] = true; pathState.via[r.node || r.peer] = true; });
    });
    var opened = false;
    pathState.nodes.forEach(function (id) {
      if (collapsed[vpcOf[id]]) { collapsed[vpcOf[id]] = false; opened = true; }
    });
    if (opened) { searchSnapshot = null; sync(); }
    var on = markPath();
    pathState.render();
    userMoved = true;
    cy.fit(on, 60);
    if (cy.zoom() > MAX_SEARCH_ZOOM) { cy.zoom(MAX_SEARCH_ZOOM); cy.center(on); }
  }
  // Draw the path on whatever is on the canvas: a collapsed VPC stands in for the path groups inside it, and a merged
  // edge for the path rules it holds. Runs after every sync so the highlight and the dimming never fall out of step.
  function markPath() {
    var nodes = cy.collection(), edges = cy.collection();
    pathState.nodes.forEach(function (id) {
      nodes = nodes.union(cy.getElementById(collapsed[vpcOf[id]] ? vpcOf[id] : id));
    });
    var vias = cy.collection();
    Object.keys(pathState.via).forEach(function (id) { vias = vias.union(cy.getElementById(id)); });
    cy.edges().forEach(function (e) {
      var hit = e.data("meta") ? e.data("members").some(function (m) { return pathState.edgeIds[m]; }) : pathState.edgeIds[e.id()];
      if (hit) edges = edges.union(e);
    });
    var on = nodes.union(edges);
    cy.elements().removeClass("path pathvia dim");
    on.addClass("path");
    vias.not(nodes).addClass("pathvia");
    cy.elements().not(on.union(vias).union(nodes.ancestors())).addClass("dim");
    // The path stays visible whatever the Ingress, Egress and Risky only toggles say.
    applyFilters();
    return on.union(vias);
  }
  // Remove the highlight and put the view (collapsed VPCs, zoom, pan) back as it was before the first query.
  function clearPath(keepInputs) {
    var was = pathState;
    pathState = null;
    cy.elements().removeClass("path pathvia dim");
    applyFilters();
    if (!keepInputs) { pathFrom.value = ""; pathTo.value = ""; pathPort.value = ""; }
    if (!was) return;
    Object.keys(vpcGroups).forEach(function (id) { collapsed[id] = !!was.collapsed[id]; });
    searchSnapshot = null;
    sync();
    cy.viewport({ zoom: was.zoom, pan: was.pan });
    shownId = null;
    showHint();
  }
  [pathFrom, pathTo, pathPort].forEach(function (box) {
    box.addEventListener("keydown", function (evt) { if (evt.key === "Enter") runPath(); });
  });
  document.getElementById("path-find").addEventListener("click", runPath);
  document.getElementById("path-clear").addEventListener("click", function () { clearPath(false); showHint(); });

  document.getElementById("reset").addEventListener("click", function () {
    clearPath(false);
    clearFocus();
    cy.nodes().removeClass("match");
    document.getElementById("search").value = "";
    cy.fit(undefined, 30);
  });
})();
</script>
</body>
</html>
