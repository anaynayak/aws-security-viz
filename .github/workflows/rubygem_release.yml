name: Ruby Gem Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build + Publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # kept: release-gem's `rake release` contacts origin to push the tag (documented as required)
      id-token: write # RubyGems trusted publishing (OIDC) and Sigstore signing for the attestations
      attestations: write # store the build provenance and SBOM attestations

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # release-gem authenticates git itself via its token input
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Check tag matches gem version
        run: |
          version="$(ruby -Ilib -e 'require "aws_security_viz/version"; print AwsSecurityViz::VERSION')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match lib/aws_security_viz/version.rb (v${version})" >&2
            exit 1
          fi
      - name: Normalise file permissions and set SOURCE_DATE_EPOCH from the tagged commit
        run: script/build-reproducible >> "$GITHUB_ENV"
      - name: Publish to RubyGems
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
      # release-gem already publishes the RubyGems-side Sigstore attestation. The steps below add the GitHub-side
      # build provenance and SBOM attestations for the same pkg/*.gem, which `gh attestation verify` checks.
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pkg/*.gem
      - name: Prepare a runtime-only source tree for the SBOM
        id: sbom-prep
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A lockfile pruned to the gemspec's runtime dependencies, so dev and test gems stay out of the SBOM.
          mkdir sbom-src
          cp aws_security_viz.gemspec Gemfile.lock LICENSE.md README.md CHANGELOG.md sbom-src/
          cp -r lib exe sbom-src/
          printf 'source "https://rubygems.org"\ngemspec\n' > sbom-src/Gemfile
          (cd sbom-src && bundle lock --local)
          mkdir release-assets
          echo "sbom-file=release-assets/aws_security_viz-${TAG#v}.sbom.cdx.json" >> "$GITHUB_OUTPUT"
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom-src
          format: cyclonedx-json
          output-file: ${{ steps.sbom-prep.outputs.sbom-file }}
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: pkg/*.gem
          sbom-path: ${{ steps.sbom-prep.outputs.sbom-file }}
      - name: Collect the provenance bundle as an intoto.jsonl asset
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: jq -c . "$BUNDLE" > "release-assets/aws_security_viz-${TAG#v}.intoto.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/

  image:
    name: Build + Push image (GHCR)
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # Sigstore signing for the image provenance
      attestations: write # store the image provenance attestation

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [release, image]
    permissions:
      contents: write # create the GitHub release for the tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets/
      - name: Create release from the CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # The section between "## [<version>]" (or "## <version>") and the next "## " heading.
          awk -v v="$version" '
            /^## / { if (found) exit; if ($0 ~ "^## \\[?" v "\\]?([^0-9.]|$)") { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for ${version}" >&2
            exit 1
          fi
          {
            echo
            echo "### Install"
            echo "- Gem: \`gem install aws_security_viz -v ${version}\`"
            echo "- Image: \`docker run --rm ghcr.io/${GITHUB_REPOSITORY}:${version} --help\`"
          } >> notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md release-assets/*
