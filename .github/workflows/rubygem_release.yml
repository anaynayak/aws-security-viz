name: Ruby Gem Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build + Publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # kept: release-gem's `rake release` contacts origin to push the tag (documented as required)
      id-token: write # RubyGems trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # release-gem authenticates git itself via its token input
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Check tag matches gem version
        run: |
          version="$(ruby -Ilib -e 'require "aws_security_viz/version"; print AwsSecurityViz::VERSION')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match lib/aws_security_viz/version.rb (v${version})" >&2
            exit 1
          fi
      - name: Publish to RubyGems
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1

  image:
    name: Build + Push image (GHCR)
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write # push to ghcr.io

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [release, image]
    permissions:
      contents: write # create the GitHub release for the tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create release from the CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # The section between "## [<version>]" (or "## <version>") and the next "## " heading.
          awk -v v="$version" '
            /^## / { if (found) exit; if ($0 ~ "^## \\[?" v "\\]?([^0-9.]|$)") { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for ${version}" >&2
            exit 1
          fi
          {
            echo
            echo "### Install"
            echo "- Gem: \`gem install aws_security_viz -v ${version}\`"
            echo "- Image: \`docker run --rm ghcr.io/${GITHUB_REPOSITORY}:${version} --help\`"
          } >> notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
