name: Ruby

on:
  # Branch pushes are covered by pull_request; running both doubled every check.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron:  '0 0 * * SAT'

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu]
        ruby: ["3.3", "3.4", "4.0"]
        include:
          - os: macos
            ruby: "4.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # Graphviz comes from the runner's distro/Homebrew repositories and is deliberately unpinned: the specs only
      # need a working `dot`, and pinning a distro version would break when the package index rotates.
      - name: Install Graphviz (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install Graphviz (macOS)
        if: runner.os == 'macOS'
        run: brew install graphviz
      - name: Lint
        run: bundle exec standardrb
      - name: Run tests
        run: bundle exec rspec

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: aws-security-viz:ci
      - name: Smoke test
        run: |
          mkdir -p out && cp spec/integration/dummy.json out/
          docker run --rm aws-security-viz:ci --version
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/out:/work" aws-security-viz:ci -o dummy.json -f viz.svg
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/out:/work" aws-security-viz:ci -o dummy.json -f viz.html
          grep -q "<svg" out/viz.svg
          grep -q "cytoscape" out/viz.html

  reproducible-gem:
    name: reproducible gem build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
      - name: Build the gem twice and compare
        run: |
          # Same commit, different umask, TZ and directory depth: script/build-reproducible must give the same checksum.
          git worktree add --detach "$RUNNER_TEMP/first" HEAD
          (umask 002; git worktree add --detach "$RUNNER_TEMP/nested/second" HEAD)
          (cd "$RUNNER_TEMP/first" && TZ=UTC script/build-reproducible "$RUNNER_TEMP/first.gem")
          (cd "$RUNNER_TEMP/nested/second" && TZ=Asia/Kolkata script/build-reproducible "$RUNNER_TEMP/second.gem")
          sha256sum "$RUNNER_TEMP/first.gem" "$RUNNER_TEMP/second.gem"
          [ "$(sha256sum < "$RUNNER_TEMP/first.gem")" = "$(sha256sum < "$RUNNER_TEMP/second.gem")" ]

  browser:
    name: browser specs (headless Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
      # Playwright is pinned in uv.lock (--locked); the Chromium build follows from that version.
      - name: Install Chromium
        run: uv run --locked --group browser playwright install --with-deps chromium
      - name: Run the browser specs
        run: bundle exec rspec spec/html_renderer_spec.rb --format documentation --fail-fast

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build the docs (strict)
        run: uv run --locked --group docs mkdocs build --strict
      - name: Check theme assets are in the built site
        # --strict does not check theme.logo / theme.favicon, and they only exist if committed
        run: test -f site/assets/favicon.svg
