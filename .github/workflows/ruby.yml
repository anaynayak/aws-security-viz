name: Ruby

on:
  # Branch pushes are covered by pull_request; running both doubled every check.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron:  '0 0 * * SAT'

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu]
        ruby: ["3.3", "3.4", "4.0"]
        include:
          - os: macos
            ruby: "4.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install Graphviz (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install Graphviz (macOS)
        if: runner.os == 'macOS'
        run: brew install graphviz
      - name: Lint
        run: bundle exec standardrb
      - name: Run tests
        run: bundle exec rspec

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: aws-security-viz:ci
      - name: Smoke test
        run: |
          mkdir -p out && cp spec/integration/dummy.json out/
          docker run --rm aws-security-viz:ci --version
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/out:/work" aws-security-viz:ci -o dummy.json -f viz.svg
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/out:/work" aws-security-viz:ci -o dummy.json -f viz.html
          grep -q "<svg" out/viz.svg
          grep -q "cytoscape" out/viz.html
