site_name: aws-security-viz
site_description: Visualise AWS security groups, see which groups can reach which, and find ingress open to the internet.
site_url: https://anaynayak.github.io/aws-security-viz/
repo_url: https://github.com/anaynayak/aws-security-viz
repo_name: anaynayak/aws-security-viz
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# Local review reports (*.html) live in docs/ but are not part of the site.
exclude_docs: |
  *.html

# Strict builds fail on these too. MkDocs only logs broken anchors at info level by default.
validation:
  anchors: warn
  unrecognized_links: warn

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - Guides:
      - Outputs: outputs.md
      - Filtering and risk checks: filtering-and-risk-checks.md
      - Credentials and IAM: credentials-and-iam.md
  - Reference:
      - Configuration: configuration.md
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md
  - Security: security.md
  - Contributing: contributing.md
  - Changelog: changelog.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
